# Builds and installs librtdebug on Linux and macOS (the platforms of the conda-forge
# package) and uses the installed library from the example program.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macos-latest ]
        build_type: [ Release, Debug ]

    steps:
      - uses: actions/checkout@v4

      - name: Build and install
        run: |
          PREFIX="$RUNNER_TEMP/prefix"
          echo "PREFIX=$PREFIX" >> "$GITHUB_ENV"
          mkdir -p "$PREFIX"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DPREFIX_PATH="$PREFIX"
          cmake --build build -j 4
          cmake --install build
          ls -l "$PREFIX/lib" "$PREFIX/include/rtdebug"

      # the example with and without the debug output, against the installed library
      - name: Use the installed library
        run: |
          for mode in -DDEBUG -DNDEBUG; do
            echo "== example $mode"
            c++ -std=c++11 $mode examples/hello_world.cpp -I"$PREFIX/include/rtdebug" \
                -L"$PREFIX/lib" -Wl,-rpath,"$PREFIX/lib" -lrtdebug -pthread -o hello_world
            ./hello_world | tee output.txt
            grep -q "Hello to rtDebug!" output.txt
          done
